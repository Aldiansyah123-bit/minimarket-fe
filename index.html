<!doctype html>
<html lang="id">

    <title>POS Minimarket - Sistem Kasir Digital</title>

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background: #f3f4f6; }
      #root { display: none; }
      #app { height: 100vh; }
      
      /* Utility Classes */

      .items-center { align-items: center; } .justify-center { justify-content: center; }

      .rounded { border-radius: 0.25rem; } .rounded-lg { border-radius: 0.5rem; } .rounded-xl { border-radius: 0.75rem; }
      .rounded-full { border-radius: 9999px; }
      .border { border: 1px solid #e5e7eb; } .border-b { border-bottom: 1px solid #e5e7eb; } .border-t { border-top: 1px solid #e5e7eb; }
      .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .header-bar { background: white; border-bottom: 1px solid #e5e7eb; padding: 0.6rem 1rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

      .badge-purple { background: #f3e8ff; color: #6b21a8; } .badge-gray { background: #f3f4f6; color: #374151; }
      
      /* Login Page */
      .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a, #1e40af, #3730a3); padding: 1rem; }
      .login-card { background: white; border-radius: 1rem; padding: 2rem; width: 100%; max-width: 24rem; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
      .login-header { text-align: center; margin-bottom: 1.5rem; }
      .logo-container { width: 4rem; height: 4rem; background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 10px 15px rgba(37,99,235,0.3); }

      .btn-login { width: 100%; padding: 0.75rem; background: #2563eb; color: white; border: none; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }

      .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .demo-btn { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid #e5e7eb; background: white; cursor: pointer; text-align: left; transition: all 0.2s; }
      .demo-btn:hover { background: #f9fafb; }

      .demo-info { flex: 1; min-width: 0; }

      .demo-info small { display: block; color: #9ca3af; font-size: 0.625rem; }
      
      /* Dashboard */
      .dashboard { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
      .page-header { margin-bottom: 1.5rem; }

      .product-qty { font-size: 0.65rem; color: #6b7280; }
      .product-revenue { font-size: 0.65rem; font-weight: 700; color: #2563eb; }
      
      /* POS */
      .pos-page { height: 100%; display: flex; flex-direction: column; }

      .product-icon { width: 100%; aspect-ratio: 1; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; margin-bottom: 0.4rem; font-size: 1.2rem; }

      .cart-count { background: rgba(255,255,255,0.2); padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; display: inline-block; margin-bottom: 0.25rem; }
      .cart-total { font-size: 1.3rem; font-weight: 700; }
      .cart-items { flex: 1; overflow-y: auto; }

      .empty-cart i { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.3; }
      .empty-cart p { font-size: 0.75rem; font-weight: 500; }
      .cart-list { display: flex; flex-direction: column; }
      .cart-item { padding: 0.6rem; border-bottom: 1px solid #f3f4f6; }

      .item-info { flex: 1; min-width: 0; }

      .item-info p { font-size: 0.6rem; color: #6b7280; }

      .item-footer { display: flex; align-items: center; justify-content: space-between; }
      .qty-controls { display: flex; align-items: center; gap: 0.25rem; }

      .qty-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
      .qty-controls span { width: 2rem; text-align: center; font-size: 0.7rem; font-weight: 700; }
      .item-subtotal { font-size: 0.7rem; font-weight: 700; color: #1d4ed8; }
      .cart-footer { border-top: 1px solid #e5e7eb; background: #f9fafb; padding: 0.75rem; }

      .summary-row.total span:last-child { color: #1d4ed8; }

      .btn-pay { flex: 1; padding: 0.5rem; background: #16a34a; color: white; border: none; border-radius: 0.5rem; font-size: 0.7rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.3rem; }
      .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; }
      
      .placeholder-page { padding: 3rem; text-align: center; }
      .placeholder-page h2 { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin-bottom: 0.5rem; }
      .placeholder-page p { color: #6b7280; }
      
      @media (max-width: 768px) {
        .sidebar { width: 60px; }
        .pos-cart { width: 280px; }
        .product-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        .dashboard-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/app.js"></script>

</html>
