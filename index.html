<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Minimarket - Sistem Kasir Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; background: #f3f4f6; }
      #root { display: none; }
      #app { height: 100vh; }
      .flex { display: flex; } .flex-col { flex-direction: column; } .flex-1 { flex: 1 1 0%; }
      .items-center { align-items: center; } .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }
      .gap-1 { gap: 0.25rem; } .gap-2 { gap: 0.5rem; } .gap-3 { gap: 0.75rem; } .gap-4 { gap: 1rem; }
      .w-full { width: 100%; } .h-full { height: 100%; }
      .p-2 { padding: 0.5rem; } .p-3 { padding: 0.75rem; } .p-4 { padding: 1rem; }
      .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
      .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .text-xs { font-size: 0.75rem; } .text-sm { font-size: 0.875rem; }
      .text-lg { font-size: 1.125rem; } .text-xl { font-size: 1.25rem; }
      .text-2xl { font-size: 1.5rem; } .text-3xl { font-size: 1.875rem; }
      .font-medium { font-weight: 500; } .font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
      .text-center { text-align: center; } .text-right { text-align: right; } .text-left { text-align: left; }
      .text-white { color: white; } .text-gray-400 { color: #9ca3af; }
      .text-gray-500 { color: #6b7280; } .text-gray-600 { color: #4b5563; }
      .text-gray-700 { color: #374151; } .text-gray-800 { color: #1f2937; }
      .text-blue-600 { color: #2563eb; } .text-blue-700 { color: #1d4ed8; }
      .text-green-600 { color: #16a34a; } .text-red-600 { color: #dc2626; }
      .bg-white { background: white; } .bg-gray-50 { background: #f9fafb; }
      .bg-gray-100 { background: #f3f4f6; } .bg-gray-200 { background: #e5e7eb; }
      .rounded { border-radius: 0.25rem; } .rounded-lg { border-radius: 0.5rem; }
      .rounded-xl { border-radius: 0.75rem; } .rounded-full { border-radius: 9999px; }
      .border { border: 1px solid #e5e7eb; } .border-b { border-bottom: 1px solid #e5e7eb; }
      .border-t { border-top: 1px solid #e5e7eb; }
      .shadow-sm { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .overflow-hidden { overflow: hidden; } .overflow-y-auto { overflow-y: auto; }
      .relative { position: relative; } .absolute { position: absolute; }
      .fixed { position: fixed; } .inset-0 { top:0;right:0;bottom:0;left:0; }
      .cursor-pointer { cursor: pointer; } .opacity-50 { opacity: 0.5; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .grid { display: grid; } .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
      .space-y-1 > * + * { margin-top: 0.25rem; }
      .space-y-2 > * + * { margin-top: 0.5rem; }
      .space-y-3 > * + * { margin-top: 0.75rem; }
      .divide-y > * + * { border-top: 1px solid #e5e7eb; }
      .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .sidebar { width: 250px; background: linear-gradient(to bottom, #1e293b, #1e293b); color: white; display: flex; flex-direction: column; transition: width 0.3s; flex-shrink: 0; height: 100vh; }
      .sidebar.collapsed { width: 60px; }
      .sidebar-nav { flex: 1; overflow-y: auto; padding: 0.75rem 0; }
      .sidebar-nav::-webkit-scrollbar { width: 4px; }
      .sidebar-nav::-webkit-scrollbar-thumb { background: #475569; border-radius: 2px; }
      .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1rem; font-size: 0.8rem; color: #cbd5e1; cursor: pointer; transition: all 0.2s; border: none; background: none; width: 100%; text-align: left; }
      .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
      .nav-item.active { background: rgba(59,130,246,0.2); color: #93c5fd; border-right: 2px solid #60a5fa; }
      .nav-item i { width: 16px; text-align: center; }
      .nav-child { padding-left: 2.5rem; font-size: 0.7rem; }
      .nav-child.active { background: rgba(59,130,246,0.3); }
      .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .header-bar { background: white; border-bottom: 1px solid #e5e7eb; padding: 0.6rem 1rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .page-content { flex: 1; overflow-y: auto; padding: 1.5rem; }
      .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem; }
      .btn-primary { background: #2563eb; color: white; } .btn-primary:hover { background: #1d4ed8; }
      .btn-success { background: #16a34a; color: white; } .btn-success:hover { background: #15803d; }
      .btn-danger { background: #dc2626; color: white; } .btn-danger:hover { background: #b91c1c; }
      .btn-secondary { background: #e5e7eb; color: #374151; } .btn-secondary:hover { background: #d1d5db; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.8rem; outline: none; }
      .input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
      .select { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 0.8rem; outline: none; background: white; }
      .card { background: white; border-radius: 0.75rem; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 600; }
      .badge-green { background: #dcfce7; color: #166534; } .badge-blue { background: #dbeafe; color: #1e40af; }
      .badge-red { background: #fee2e2; color: #991b1b; } .badge-yellow { background: #fef9c3; color: #854d0e; }
      .badge-purple { background: #f3e8ff; color: #6b21a8; } .badge-gray { background: #f3f4f6; color: #374151; }
      .tbl { width: 100%; font-size: 0.8rem; border-collapse: collapse; }
      .tbl th { text-align: left; padding: 0.6rem 1rem; font-weight: 500; color: #6b7280; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
      .tbl td { padding: 0.6rem 1rem; border-bottom: 1px solid #f3f4f6; }
      .tbl tr:hover td { background: #f9fafb; }
      .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
      .modal-box { background: white; border-radius: 1rem; box-shadow: 0 25px 50px rgba(0,0,0,0.25); width: 100%; max-width: 32rem; margin: 1rem; overflow: hidden; }
      .modal-hdr { padding: 1rem; background: linear-gradient(to right, #2563eb, #1d4ed8); color: white; display: flex; align-items: center; justify-content: space-between; }
      .modal-bd { padding: 1rem; max-height: 60vh; overflow-y: auto; }
      .modal-ft { padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }
      .pos-layout { display: flex; height: 100%; }
      .pos-products { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
      .pos-cart { width: 360px; background: white; border-left: 1px solid #e5e7eb; display: flex; flex-direction: column; box-shadow: -4px 0 15px rgba(0,0,0,0.05); }
      .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; padding: 0.75rem; overflow-y: auto; flex: 1; }
      .product-card { background: white; border: 2px solid #f3f4f6; border-radius: 0.75rem; padding: 0.6rem; cursor: pointer; transition: all 0.2s; text-align: left; }
      .product-card:hover { border-color: #93c5fd; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transform: translateY(-2px); }
      .product-card:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
      .product-icon { width: 100%; aspect-ratio: 1; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; margin-bottom: 0.4rem; font-size: 1.2rem; }
      .category-bar { display: flex; gap: 0.4rem; overflow-x: auto; padding: 0.5rem 0.75rem; }
      .category-bar::-webkit-scrollbar { display: none; }
      .cat-btn { padding: 0.35rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 500; white-space: nowrap; border: none; cursor: pointer; transition: all 0.2s; }
      .cat-btn.active { background: #2563eb; color: white; }
      .cat-btn:not(.active) { background: #f3f4f6; color: #4b5563; }
      .cat-btn:not(.active):hover { background: #e5e7eb; }
      .stat-card { background: white; border-radius: 0.75rem; padding: 1rem; border: 1px solid #e5e7eb; }
      .stat-icon { width: 2.5rem; height: 2.5rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; margin-bottom: 0.5rem; }
      .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a, #1e40af, #3730a3); padding: 1rem; }
      .login-card { background: white; border-radius: 1rem; padding: 2rem; width: 100%; max-width: 24rem; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
      .receipt { border: 2px dashed #d1d5db; border-radius: 0.5rem; padding: 1rem; font-family: 'Courier New', monospace; font-size: 0.7rem; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      @media (max-width: 768px) { .sidebar { width: 60px; } .pos-cart { width: 280px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app"></div>
    <script type="text/x-template" id="app-template">
      <div v-if="!currentUser" class="login-page">
        <div class="login-card">
          <div style="text-align:center;margin-bottom:1.5rem;">
            <div style="width:4rem;height:4rem;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:1rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
              <i class="fas fa-store" style="font-size:1.5rem;color:white;"></i>
            </div>
            <h2 style="font-size:1.5rem;font-weight:700;color:#1f2937;">Selamat Datang</h2>
            <p style="color:#6b7280;font-size:0.8rem;margin-top:0.25rem;">POS Minimarket - Sistem Kasir Digital</p>
          </div>
          <form v-on:submit.prevent="login">
            <div style="margin-bottom:1rem;">
              <label style="font-size:0.75rem;font-weight:500;display:block;margin-bottom:0.25rem;">Username</label>
              <input v-model="loginForm.username" type="text" placeholder="Masukkan username" class="input" required />
            </div>
            <div style="margin-bottom:1rem;">
              <label style="font-size:0.75rem;font-weight:500;display:block;margin-bottom:0.25rem;">Password</label>
              <input v-model="loginForm.password" :type="showPassword ? 'text' : 'password'" placeholder="Masukkan password" class="input" required />
            </div>
            <div v-if="loginError" style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:0.6rem;border-radius:0.5rem;font-size:0.8rem;margin-bottom:1rem;">
              <i class="fas fa-exclamation-circle"></i> {{ loginError }}
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;padding:0.75rem;font-size:0.9rem;justify-content:center;">
              <i class="fas fa-right-to-bracket"></i> Masuk
            </button>
          </form>
          <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e5e7eb;">
            <p style="font-size:0.7rem;color:#6b7280;text-align:center;margin-bottom:0.5rem;">Demo Accounts:</p>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;">
              <button v-for="acc in demoAccounts" :key="acc.username" v-on:click="fillLogin(acc)" style="display:flex;align-items:center;gap:0.5rem;padding:0.4rem;border-radius:0.5rem;border:1px solid #e5e7eb;background:white;cursor:pointer;text-align:left;font-size:0.7rem;">
                <div :style="'width:1.5rem;height:1.5rem;border-radius:50%;background:' + acc.color + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;'">
                  <i class="fas fa-user" style="font-size:0.5rem;color:white;"></i>
                </div>
                <div><p style="font-weight:600;">{{ acc.role }}</p><p style="color:#9ca3af;font-size:0.6rem;">{{ acc.username }}</p></div>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div v-else style="display:flex;height:100vh;overflow:hidden;">
        <div :class="['sidebar', { collapsed: sidebarCollapsed }]">
          <div style="padding:1rem;border-bottom:1px solid #334155;">
            <div class="flex items-center gap-3">
              <div style="width:2rem;height:2rem;background:#3b82f6;border-radius:0.5rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="fas fa-store" style="font-size:0.75rem;color:white;"></i>
              </div>
              <div v-if="!sidebarCollapsed">
                <h1 style="font-size:0.8rem;font-weight:700;">POS Minimarket</h1>
                <p style="font-size:0.6rem;color:#94a3b8;">Sistem Kasir Digital</p>
              </div>
            </div>
          </div>
          <div v-if="!sidebarCollapsed && currentShift" style="margin:0.75rem;padding:0.5rem;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:0.5rem;">
            <div class="flex items-center gap-2">
              <div style="width:0.5rem;height:0.5rem;background:#4ade80;border-radius:50%;"></div>
              <span style="font-size:0.65rem;color:#86efac;">Shift Aktif</span>
            </div>
            <p style="font-size:0.65rem;color:#cbd5e1;margin-top:0.25rem;">Modal: {{ formatRupiah(currentShift.initialModal) }}</p>
          </div>
          <nav class="sidebar-nav">
            <template v-for="item in filteredMenu">
              <button :class="['nav-item', { active: currentPage === item.id || (item.children && item.children.some(function(c){return c.id === currentPage})) }]" v-on:click="item.children ? toggleMenu(item.id) : navigateTo(item.id)">
                <i :class="'fas ' + item.icon"></i>
                <span v-if="!sidebarCollapsed" style="flex:1;">{{ item.label }}</span>
                <i v-if="!sidebarCollapsed && item.children" :class="['fas fa-chevron-down', { 'fa-rotate-180': expandedMenus.includes(item.id) }]" style="font-size:0.6rem;"></i>
              </button>
              <template v-if="!sidebarCollapsed && item.children && expandedMenus.includes(item.id)">
                <button v-for="child in item.children.filter(function(c){return hasRoleAccess(c.roles)})" :key="child.id" :class="['nav-item nav-child', { active: currentPage === child.id }]" v-on:click="navigateTo(child.id)">
                  <i :class="'fas ' + child.icon" style="font-size:0.6rem;"></i>
                  <span>{{ child.label }}</span>
                </button>
              </template>
            </template>
          </nav>
          <div style="padding:0.75rem;border-top:1px solid #334155;">
            <div v-if="!sidebarCollapsed" class="flex items-center gap-2">
              <div style="width:2rem;height:2rem;background:#475569;border-radius:50%;display:flex;align-items:center;justify-content:center;">
                <i class="fas fa-user" style="font-size:0.6rem;color:white;"></i>
              </div>
              <div style="flex:1;min-width:0;">
                <p style="font-size:0.7rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ currentUser.name }}</p>
                <span :class="'badge ' + roleBadge.color" style="font-size:0.55rem;">{{ roleBadge.label }}</span>
              </div>
              <button v-on:click="logout" style="background:none;border:none;color:#94a3b8;cursor:pointer;"><i class="fas fa-right-from-bracket"></i></button>
            </div>
            <button v-else v-on:click="logout" style="width:100%;background:none;border:none;color:#94a3b8;cursor:pointer;text-align:center;"><i class="fas fa-right-from-bracket"></i></button>
          </div>
        </div>

        <div class="main-content">
          <div class="header-bar">
            <div class="flex items-center gap-3">
              <button v-on:click="sidebarCollapsed = !sidebarCollapsed" style="background:none;border:none;cursor:pointer;color:#6b7280;"><i class="fas fa-bars"></i></button>
              <h2 style="font-size:0.85rem;font-weight:600;color:#1f2937;">{{ currentPageLabel }}</h2>
            </div>
            <div class="flex items-center gap-3">
              <span :class="'badge ' + roleBadge.color">{{ roleBadge.label }}</span>
              <span style="font-size:0.8rem;font-weight:500;color:#374151;">{{ currentUser.name }}</span>
            </div>
          </div>
          <div class="page-content">
            <div v-if="currentPage === 'dashboard'" v-html="renderDashboard()"></div>
            <div v-if="currentPage === 'pos-new'" v-html="renderPOS()"></div>
            <div v-if="currentPage === 'pos-held'" v-html="renderHeldOrders()"></div>
            <div v-if="currentPage === 'pos-history'" v-html="renderSalesHistory()"></div>
            <div v-if="currentPage === 'products-all'" v-html="renderProductsAll()"></div>
            <div v-if="currentPage === 'products-categories'" v-html="renderCategories()"></div>
            <div v-if="currentPage === 'products-brands'" v-html="renderBrands()"></div>
            <div v-if="currentPage === 'products-units'" v-html="renderUnits()"></div>
            <div v-if="currentPage === 'products-pricing'" v-html="renderPricing()"></div>
            <div v-if="currentPage === 'purchase-new'" v-html="renderNewPurchase()"></div>
            <div v-if="currentPage === 'purchase-history'" v-html="renderPurchaseHistory()"></div>
            <div v-if="currentPage === 'purchase-suppliers'" v-html="renderSuppliers()"></div>
            <div v-if="currentPage === 'inventory-stock'" v-html="renderStock()"></div>
            <div v-if="currentPage === 'inventory-mutation'" v-html="renderMutation()"></div>
            <div v-if="currentPage === 'inventory-adjustment'" v-html="renderAdjustment()"></div>
            <div v-if="currentPage === 'inventory-opname'" v-html="renderOpname()"></div>
            <div v-if="currentPage === 'customer-all'" v-html="renderCustomers()"></div>
            <div v-if="currentPage === 'customer-members'" v-html="renderMembers()"></div>
            <div v-if="currentPage === 'transaction-sales'" v-html="renderTxSales()"></div>
            <div v-if="currentPage === 'transaction-return'" v-html="renderReturn()"></div>
            <div v-if="currentPage === 'transaction-expenses'" v-html="renderExpenses()"></div>
            <div v-if="currentPage === 'reports-sales'" v-html="renderReportSales()"></div>
            <div v-if="currentPage === 'reports-product'" v-html="renderReportProduct()"></div>
            <div v-if="currentPage === 'reports-purchase'" v-html="renderReportPurchase()"></div>
            <div v-if="currentPage === 'reports-stock'" v-html="renderReportStock()"></div>
            <div v-if="currentPage === 'reports-profit'" v-html="renderReportProfit()"></div>
            <div v-if="currentPage === 'reports-cash'" v-html="renderReportCash()"></div>
            <div v-if="currentPage === 'settings-store'" v-html="renderSettingsStore()"></div>
            <div v-if="currentPage === 'settings-branch'" v-html="renderSettingsBranch()"></div>
            <div v-if="currentPage === 'settings-users'" v-html="renderSettingsUsers()"></div>
            <div v-if="currentPage === 'settings-roles'" v-html="renderSettingsRoles()"></div>
            <div v-if="currentPage === 'settings-payment'" v-html="renderSettingsPayment()"></div>
            <div v-if="currentPage === 'settings-printer'" v-html="renderSettingsPrinter()"></div>
            <div v-if="currentPage === 'settings-receipt'" v-html="renderSettingsReceipt()"></div>
          </div>
        </div>

        <!-- PAYMENT MODAL -->
        <div v-if="showPaymentModal" class="modal-overlay" style="z-index:100;">
          <div class="modal-box">
            <div class="modal-hdr"><h2 style="font-weight:700;"><i class="fas fa-cash-register" style="margin-right:0.5rem;"></i>Pembayaran</h2><button v-on:click="showPaymentModal=false" style="width:1.75rem;height:1.75rem;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:white;cursor:pointer;"><i class="fas fa-times" style="font-size:0.7rem;"></i></button></div>
            <div class="modal-bd">
              <div style="background:#111827;color:white;border-radius:0.75rem;padding:1rem;text-align:center;margin-bottom:1rem;"><p style="font-size:0.7rem;color:#9ca3af;">Total Pembayaran</p><p style="font-size:1.5rem;font-weight:700;">{{ formatRupiah(cartGrandTotal) }}</p></div>
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1rem;">
                <button v-for="pm in paymentMethods.filter(function(p){return p.active})" :key="pm.id" v-on:click="paymentMethod=pm.name" :style="'padding:0.5rem;border-radius:0.5rem;border:2px solid;text-align:center;cursor:pointer;font-size:0.7rem;font-weight:500;'+(paymentMethod===pm.name?'border-color:#2563eb;background:#eff6ff;':'border-color:#e5e7eb;')"><i :class="'fas '+pm.icon" style="color:#2563eb;display:block;margin-bottom:0.2rem;"></i>{{ pm.name }}</button>
              </div>
              <div v-if="paymentMethod === 'Tunai'">
                <div style="position:relative;margin-bottom:0.75rem;"><span style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:#6b7280;font-weight:500;">Rp</span><input v-model="cashInput" type="text" class="input" style="padding-left:2.5rem;font-size:1.2rem;font-weight:700;" placeholder="0" /></div>
                <div v-if="cashValue > 0" :style="'padding:0.75rem;border-radius:0.5rem;text-align:center;'+(cashChange>=0?'background:#f0fdf4;border:1px solid #bbf7d0;':'background:#fef2f2;border:1px solid #fecaca;')"><p style="font-size:0.7rem;color:#4b5563;">Kembalian</p><p :style="'font-size:1.3rem;font-weight:700;'+(cashChange>=0?'color:#16a34a;':'color:#dc2626;')">{{ cashChange >= 0 ? formatRupiah(cashChange) : 'Kurang ' + formatRupiah(Math.abs(cashChange)) }}</p></div>
              </div>
            </div>
            <div class="modal-ft"><button v-on:click="showPaymentModal=false" class="btn btn-secondary">Batal</button><button v-on:click="processPayment" :disabled="!isPaymentValid" class="btn btn-success" style="flex:1;"><i class="fas fa-check-circle"></i> Proses</button></div>
          </div>
        </div>

        <!-- RECEIPT MODAL -->
        <div v-if="showReceiptModal && lastTransaction" class="modal-overlay" style="z-index:100;">
          <div class="modal-box" style="max-width:24rem;">
            <div style="background:#16a34a;color:white;padding:1rem;text-align:center;"><div style="width:3rem;height:3rem;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 0.5rem;"><i class="fas fa-check" style="font-size:1.2rem;"></i></div><h2 style="font-weight:700;">Transaksi Berhasil!</h2></div>
            <div style="padding:1rem;">
              <div class="receipt">
                <div style="text-align:center;margin-bottom:0.5rem;padding-bottom:0.5rem;border-bottom:1px dashed #d1d5db;"><p style="font-weight:700;font-size:0.8rem;">{{ storeSettings.name }}</p><p style="font-size:0.6rem;color:#6b7280;">{{ storeSettings.address }}</p></div>
                <div style="margin-bottom:0.5rem;padding-bottom:0.5rem;border-bottom:1px dashed #d1d5db;"><div class="flex justify-between" style="font-size:0.6rem;"><span>No:</span><span>{{ lastTransaction.invoiceNo }}</span></div><div class="flex justify-between" style="font-size:0.6rem;"><span>Kasir:</span><span>{{ lastTransaction.cashierName }}</span></div></div>
                <div style="margin-bottom:0.5rem;padding-bottom:0.5rem;border-bottom:1px dashed #d1d5db;"><div v-for="item in lastTransaction.items" :key="item.product.id" style="margin-bottom:0.3rem;"><p style="font-size:0.6rem;">{{ item.product.name }}</p><div class="flex justify-between" style="font-size:0.55rem;color:#6b7280;"><span>{{ item.quantity }} x {{ formatRupiah(item.product.sellPrice) }}</span><span>{{ formatRupiah(item.product.sellPrice * item.quantity) }}</span></div></div></div>
                <div class="flex justify-between" style="font-weight:700;font-size:0.75rem;margin-bottom:0.5rem;"><span>TOTAL:</span><span>{{ formatRupiah(lastTransaction.total) }}</span></div>
                <div class="flex justify-between" style="font-size:0.6rem;"><span>Bayar ({{ lastTransaction.paymentMethod }}):</span><span>{{ formatRupiah(lastTransaction.paymentAmount) }}</span></div>
                <div v-if="lastTransaction.change > 0" class="flex justify-between" style="font-size:0.6rem;"><span>Kembali:</span><span>{{ formatRupiah(lastTransaction.change) }}</span></div>
                <div style="text-align:center;margin-top:0.5rem;padding-top:0.5rem;border-top:1px dashed #d1d5db;"><p style="font-size:0.55rem;color:#6b7280;">Terima kasih!</p></div>
              </div>
            </div>
            <div style="padding:0.75rem;border-top:1px solid #e5e7eb;display:flex;gap:0.5rem;"><button v-on:click="newTransaction" class="btn btn-primary" style="flex:1;"><i class="fas fa-plus"></i> Transaksi Baru</button></div>
          </div>
        </div>

        <!-- SHIFT MODAL -->
        <div v-if="showShiftModal" class="modal-overlay" style="z-index:100;">
          <div class="modal-box" style="max-width:24rem;">
            <div style="background:linear-gradient(to right,#16a34a,#15803d);color:white;padding:1rem;text-align:center;"><i class="fas fa-door-open" style="font-size:1.5rem;margin-bottom:0.5rem;display:block;"></i><h2 style="font-weight:700;">Open Shift</h2><p style="font-size:0.8rem;color:#bbf7d0;">Masukkan modal awal</p></div>
            <div class="modal-bd"><label style="font-size:0.75rem;font-weight:500;display:block;margin-bottom:0.25rem;">Modal Awal</label><div style="position:relative;"><span style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:#6b7280;">Rp</span><input v-model.number="shiftModalAmount" type="number" placeholder="500000" class="input" style="padding-left:2.5rem;font-size:1.1rem;font-weight:700;" /></div></div>
            <div class="modal-ft"><button v-on:click="startShift" class="btn btn-success" style="flex:1;"><i class="fas fa-play"></i> Mulai Shift</button></div>
          </div>
        </div>

        <!-- PRODUCT FORM MODAL -->
        <div v-if="showProductForm" class="modal-overlay" style="z-index:100;">
          <div class="modal-box" style="max-width:36rem;">
            <div class="modal-hdr"><h2 style="font-weight:700;">{{ editingProduct ? 'Edit' : 'Tambah' }} Produk</h2><button v-on:click="showProductForm=false" style="width:1.75rem;height:1.75rem;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:white;cursor:pointer;"><i class="fas fa-times" style="font-size:0.7rem;"></i></button></div>
            <div class="modal-bd"><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;"><div style="grid-column:span 2;"><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Nama</label><input v-model="productForm.name" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">SKU</label><input v-model="productForm.sku" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Barcode</label><input v-model="productForm.barcode" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Kategori</label><select v-model="productForm.categoryId" class="select" style="width:100%;"><option v-for="c in categories" :key="c.id" :value="c.id">{{ c.name }}</option></select></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Brand</label><select v-model="productForm.brandId" class="select" style="width:100%;"><option v-for="b in brands" :key="b.id" :value="b.id">{{ b.name }}</option></select></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Harga Beli</label><input v-model.number="productForm.buyPrice" type="number" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Harga Jual</label><input v-model.number="productForm.sellPrice" type="number" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Harga Grosir</label><input v-model.number="productForm.wholesalePrice" type="number" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Min Stok</label><input v-model.number="productForm.minStock" type="number" class="input" /></div></div></div>
            <div class="modal-ft"><button v-on:click="showProductForm=false" class="btn btn-secondary">Batal</button><button v-on:click="saveProduct" class="btn btn-primary" style="flex:1;"><i class="fas fa-save"></i> Simpan</button></div>
          </div>
        </div>

        <!-- GENERIC FORM MODAL -->
        <div v-if="showGenericForm" class="modal-overlay" style="z-index:100;">
          <div class="modal-box" style="max-width:24rem;">
            <div class="modal-hdr"><h2 style="font-weight:700;">{{ genericFormTitle }}</h2><button v-on:click="showGenericForm=false" style="width:1.75rem;height:1.75rem;border-radius:50%;background:rgba(255,255,255,0.2);border:none;color:white;cursor:pointer;"><i class="fas fa-times" style="font-size:0.7rem;"></i></button></div>
            <div class="modal-bd"><div class="space-y-3"><div v-for="field in genericFormFields" :key="field.key"><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">{{ field.label }}</label><input v-model="genericFormData[field.key]" :type="field.type || 'text'" class="input" /></div></div></div>
            <div class="modal-ft"><button v-on:click="showGenericForm=false" class="btn btn-secondary">Batal</button><button v-on:click="saveGenericForm" class="btn btn-primary" style="flex:1;"><i class="fas fa-save"></i> Simpan</button></div>
          </div>
        </div>

        <!-- EXPENSE FORM MODAL -->
        <div v-if="showExpenseForm" class="modal-overlay" style="z-index:100;">
          <div class="modal-box" style="max-width:24rem;">
            <div style="background:#dc2626;color:white;padding:1rem;"><h2 style="font-weight:700;">Tambah Pengeluaran</h2></div>
            <div class="modal-bd"><div class="space-y-3"><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Kategori</label><select v-model="expenseForm.category" class="select" style="width:100%;"><option value="">-- Pilih --</option><option>Operasional</option><option>Transport</option><option>Listrik & Air</option><option>Perlengkapan</option><option>Lainnya</option></select></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Keterangan</label><input v-model="expenseForm.description" class="input" /></div><div><label style="font-size:0.7rem;font-weight:500;display:block;margin-bottom:0.2rem;">Jumlah</label><input v-model.number="expenseForm.amount" type="number" class="input" /></div></div></div>
            <div class="modal-ft"><button v-on:click="showExpenseForm=false" class="btn btn-secondary">Batal</button><button v-on:click="saveExpense" class="btn btn-danger" style="flex:1;">Simpan</button></div>
          </div>
        </div>

      </div>
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/app.js"></script>
  </body>
</html>
